name: AI Investment Digest

on:
  schedule:
    # 12:17 Asia/Shanghai = 04:17 UTC.
    # Avoid minute 0 because GitHub schedule jobs can be delayed or dropped at hourly peaks.
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and send digest
        env:
          AI_DIGEST_SMTP_USER: ${{ secrets.AI_DIGEST_SMTP_USER }}
          AI_DIGEST_SMTP_AUTH_CODE: ${{ secrets.AI_DIGEST_SMTP_AUTH_CODE }}
          AI_DIGEST_EMAIL_TO: ${{ secrets.AI_DIGEST_EMAIL_TO }}
          AI_DIGEST_SMTP_HOST: smtp.163.com
          AI_DIGEST_SMTP_PORT: "465"
        run: python tools/build_ai_digest.py

      - name: Upload digest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-digest
          path: out/*.txt
